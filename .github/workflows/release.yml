name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore MouseDeck.sln

      - name: Run unit tests
        run: dotnet test MouseDeck.sln -c Release --no-restore --nologo

      - name: Build Portable & Standalone Release Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          .\publish.ps1 -All
          Move-Item "dist\MouseDeck.exe" "dist\MouseDeck-$tag-win-x64-portable.exe" -Force
          Move-Item "dist\MouseDeck-standalone.exe" "dist\MouseDeck-$tag-win-x64-standalone.exe" -Force
          $hashes = Get-ChildItem "dist\*.exe" | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines("$PWD\dist\SHA256SUMS.txt", $hashes)
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/MouseDeck-*-win-x64-portable.exe
            dist/MouseDeck-*-win-x64-standalone.exe
            dist/SHA256SUMS.txt
